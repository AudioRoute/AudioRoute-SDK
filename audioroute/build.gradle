apply plugin: 'com.android.library'
apply plugin: 'com.vanniktech.maven.publish'

android {
    signingConfigs {
        release {
            storeFile file('../../private/codesigning/ntrack_debug_key.keystore')
            storePassword 'android'
            keyPassword 'android'
            keyAlias = 'androiddebugkey'
        }
    }
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        ndk {
            moduleName "audiomodule"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles 'proguard-rules.txt'
            //getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        debug {
            minifyEnabled false
            jniDebuggable = true
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    ndkVersion "29.0.14206865"
    lint {
        quiet true
        abortOnError false
        ignoreWarnings true
    }
    buildFeatures {
        buildConfig true // AudioRouteHostController uses BuildConfig.DEBUG
        aidl true
        prefabPublishing true
    }
    prefab {
        audiomodule {
            // Public API only (a copy of src/main/jni/audio_module.h, keep them in sync)
            headers "include"
        }
    }
    namespace 'com.ntrack.audioroute'
}

dependencies {
    implementation 'com.android.support:support-v4:28.0.0'
}

// Maven Central publishing: ./gradlew :audioroute:publishToMavenCentral
// Coordinates and POM come from GROUP / VERSION_NAME / POM_* in ../gradle.properties and
// ./gradle.properties. Credentials and the signing key go in ~/.gradle/gradle.properties
// (never in this repo): mavenCentralUsername, mavenCentralPassword (Central Portal user token),
// signing.keyId, signing.password, signing.secretKeyRingFile
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
}
